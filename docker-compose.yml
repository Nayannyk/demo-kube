services:
  redis:
    image: redis:7-alpine
    container_name: demo-redis
    restart: unless-stopped
    command: ["--requirepass", "demo-pass-123", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "demo-pass-123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./app
    container_name: demo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: demo-pass-123
      APP_VERSION: "0.1.0"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: demo-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      BACKEND_URL: "http://backend:5000"
    depends_on:
      - backend
