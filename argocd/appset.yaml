apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-backend
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: demo-kube
spec:
  generators:
    - list:
        elements:
          - cluster: 172.31.40.76:33893
            url: https://172.31.40.76:33893
            appName: demo-backend
  template:
    metadata:
      name: '{{appName}}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: demo-kube
      # Argo CD Image Updater: watch Docker Hub and auto-update image tags in
      # k8s/*.yaml on the `manifests` branch (write-back method: git).
      annotations:
        argocd-image-updater.argoproj.io/image-list: backend=nayannyk/demo-backend,frontend=nayannyk/demo-frontend
        argocd-image-updater.argoproj.io/backend.update-strategy: latest
        argocd-image-updater.argoproj.io/frontend.update-strategy: latest
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/image-updater-creds
        argocd-image-updater.argoproj.io/git-branch: manifests
    spec:
      project: default
      source:
        repoURL: https://github.com/Nayannyk/demo-kube.git
        targetRevision: manifests
        path: k8s
      destination:
        server: '{{url}}'
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
